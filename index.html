<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RVCE SGPA Calculator</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 450px; border-top: 8px solid #003366; }
        h2 { text-align: center; color: #003366; font-size: 1.3rem; margin-bottom: 20px; }
        .input-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; position: relative; }
        label { font-weight: 600; color: #444; font-size: 0.9rem; }
        input { width: 80px; padding: 8px; border: 2px solid #ccc; border-radius: 5px; text-align: center; font-size: 1rem; }
        input:focus { outline: none; border-color: #003366; }
        input.error { border-color: #ff4d4d; background-color: #fff2f2; }
        button { width: 100%; padding: 15px; background: #003366; color: #ffcc00; border: none; border-radius: 8px; cursor: pointer; font-size: 1.1rem; font-weight: bold; margin-top: 20px; }
        #error-msg { color: #ff4d4d; font-size: 0.85rem; text-align: center; margin-top: 10px; display: none; font-weight: bold; }
        #result-box { margin-top: 25px; padding: 20px; text-align: center; border-radius: 10px; display: none; background: #e7f3ff; border: 1px solid #003366; color: #003366; }
        .sgpa-value { font-size: 2.2rem; display: block; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>RV College of Engineering<br>First Semester (C Cycle)<br>SGPA Calculator</h2>
    
    <div class="input-row"><label>Math (4 Credits)</label><input type="number" class="grade-input" id="m" min="0" max="10" placeholder="0-10"></div>
    <div class="input-row"><label>Chemistry (4 Credits)</label><input type="number" class="grade-input" id="chem" min="0" max="10" placeholder="0-10"></div>
    <div class="input-row"><label>CAEG (3 Credits)</label><input type="number" class="grade-input" id="cad" min="0" max="10" placeholder="0-10"></div>
    <div class="input-row"><label>PLC (3 Credits)</label><input type="number" class="grade-input" id="plc" min="0" max="10" placeholder="0-10"></div>
    <div class="input-row"><label>ESC (3 Credits)</label><input type="number" class="grade-input" id="esc" min="0" max="10" placeholder="0-10"></div>
    <div class="input-row"><label>English (1 Credit)</label><input type="number" class="grade-input" id="eng" min="0" max="10" placeholder="0-10"></div>
    <div class="input-row"><label>Constitution (1 Credit)</label><input type="number" class="grade-input" id="con" min="0" max="10" placeholder="0-10"></div>
    <div class="input-row"><label>Yoga (1 Credit)</label><input type="number" class="grade-input" id="yog" min="0" max="10" placeholder="0-10"></div>
    
    <div id="error-msg">⚠️ Please enter a valid grade point between 0 and 10</div>
    <button id="calc-btn" onclick="calculateSGPA()">Calculate SGPA</button>

    <div id="result-box">
        <span>YOUR FINAL SGPA IS</span>
        <strong class="sgpa-value" id="sgpa-num">0.00</strong>
    </div>
</div>

<script>
    const inputs = document.querySelectorAll('.grade-input');
    const errorMsg = document.getElementById('error-msg');

    // Handle "Enter" key and Validation
    inputs.forEach((input, index) => {
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                // Move to next input or click button if it's the last one
                if (index < inputs.length - 1) {
                    inputs[index + 1].focus();
                } else {
                    calculateSGPA();
                }
            }
        });

        // Real-time validation for non-numeric or out of range
        input.addEventListener('input', () => {
            let val = parseFloat(input.value);
            if (val < 0 || val > 10 || isNaN(val)) {
                input.classList.add('error');
                errorMsg.style.display = 'block';
            } else {
                input.classList.remove('error');
                errorMsg.style.display = 'none';
            }
        });
    });

    function calculateSGPA() {
        let isValid = true;
        let vals = {};

        inputs.forEach(input => {
            let val = parseFloat(input.value);
            if (isNaN(val) || val < 0 || val > 10) {
                isValid = false;
                input.classList.add('error');
            }
            vals[input.id] = val || 0;
        });

        if (!isValid) {
            errorMsg.style.display = 'block';
            document.getElementById('result-box').style.display = 'none';
            return;
        }

        // Logic
        let totalPoints = ((vals.m + vals.chem) * 4) + ((vals.cad + vals.plc + vals.esc) * 3) + ((vals.eng + vals.con + vals.yog) * 1);
        let sgpa = totalPoints / 20;

        document.getElementById('result-box').style.display = 'block';
        document.getElementById('sgpa-num').innerHTML = sgpa.toFixed(2);
        errorMsg.style.display = 'none';
    }
</script>

</body>
</html>
